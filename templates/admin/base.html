<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Admin{% endblock %} — {{ S.company_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a href="{{ url_for('admin_dashboard') }}" class="brand">{{ S.company_name }}<small>Admin Panel</small></a>
    <nav>
      <a href="{{ url_for('admin_dashboard') }}" class="{{ 'on' if request.endpoint == 'admin_dashboard' }}">Dashboard</a>
      <a href="{{ url_for('admin_projects') }}" class="{{ 'on' if request.endpoint in ('admin_projects','admin_project_new','admin_project_edit') }}">Proyek</a>
      <a href="{{ url_for('admin_messages') }}" class="{{ 'on' if request.endpoint in ('admin_messages','admin_message_view') }}">Pesan{% if unread_count %}<em>{{ unread_count }}</em>{% endif %}</a>
      <a href="{{ url_for('admin_settings') }}" class="{{ 'on' if request.endpoint == 'admin_settings' }}">Pengaturan</a>
    </nav>
    <div class="side-foot">
      <a href="{{ url_for('index') }}" target="_blank">Lihat website ↗</a>
      <form method="post" action="{{ url_for('admin_logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link-btn">Keluar ({{ current_user.username }})</button>
      </form>
    </div>
  </aside>

  <main class="main">
    {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for c, m in msgs %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
